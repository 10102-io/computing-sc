# ShieldVault security evidence (docs/security/tooling-report.md).
#
# Four independent jobs so one slow or flaky tool never hides another's
# result: the Hardhat suite, coverage of the review targets (ShieldVault v2
# and v3, the registry), static analysis (Slither) and the Foundry fuzz and
# invariant suite. Aderyn ran beside Slither until its maintainer retired it
# and withdrew its downloads on 2026-11-13; its last reports are kept in
# docs/security/aderyn-2026-11-12/.
# Everything here runs on the public toolchain only; no secrets, no RPC.
#
# Tests run with HARDHAT_NO_FORK=1 so a stray fork-block.json can never
# turn CI into a mainnet fork.
name: security

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # A newer push replaces a running run; a manual re-run is never cancelled.
  cancel-in-progress: ${{ github.run_attempt == 1 }}

env:
  HARDHAT_NO_FORK: "1"
  NODE_OPTIONS: ""

jobs:
  tests:
    name: hardhat tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx hardhat compile
      - run: npx hardhat test
      # deployments/<net>/*.json pointers must agree with each other; the
      # on-chain cross-check needs an RPC and runs by hand (--network).
      - run: npx hardhat run scripts/audit-deployment-artifacts.ts

  coverage:
    name: coverage (ShieldVault v2 and v3, registry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run coverage
      # The review targets must stay fully covered. The two branch arms per
      # vault that are unreachable by construction are documented in
      # docs/security/tooling-report.md; the threshold below allows exactly those.
      - name: enforce thresholds
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json");
            const want = {
              "contracts/shield/ShieldVault.sol": { lines: 100, statements: 100, functions: 100, branches: 98 },
              "contracts/shield/ShieldVaultV3.sol": { lines: 100, statements: 100, functions: 100, branches: 98 },
              "contracts/common/QuantumRecoveryRegistry.sol": { lines: 100, statements: 100, functions: 100, branches: 100 },
            };
            let bad = 0;
            for (const [file, min] of Object.entries(want)) {
              const got = s[file];
              if (!got) { console.error("missing coverage for", file); bad++; continue; }
              for (const [metric, pct] of Object.entries(min)) {
                const have = got[metric].pct;
                const ok = have >= pct;
                console.log(`${ok ? "ok  " : "LOW "} ${file} ${metric} ${have}% (min ${pct}%)`);
                if (!ok) bad++;
              }
            }
            process.exit(bad ? 1 : 0);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            coverage.json
          retention-days: 30

  static-analysis:
    name: slither
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6 solc-select==1.2.0
      - run: solc-select install 0.8.35 && solc-select use 0.8.35
      # crytic-compile reads `forge config` for remappings whenever a
      # foundry.toml is present, even with the framework forced to solc.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      # Slither runs on the review targets straight through solc (no Hardhat
      # compile), with the deployed compiler settings. Every finding is
      # triaged in docs/security/static-analysis.md; the false positives
      # rated Medium or High there (three per vault) are recorded in
      # slither.db.json so the contracts stay untouched, and anything new at
      # Medium or above fails the job. Low and informational results are
      # reported, not fatal.
      - name: slither
        run: |
          set -o pipefail
          for f in contracts/shield/ShieldVault.sol contracts/shield/ShieldVaultV3.sol contracts/common/QuantumRecoveryRegistry.sol; do
            slither "$f" \
              --compile-force-framework solc \
              --solc-remaps "@openzeppelin=node_modules/@openzeppelin" \
              --solc-args "--via-ir --optimize --optimize-runs 200 --evm-version cancun" \
              --filter-paths "node_modules" \
              --triage-database slither.db.json \
              --fail-medium \
              --json "slither-$(basename "$f" .sol).json" 2>&1 | tee -a slither.txt || exit 1
          done
      # Legacy v3 (wave B) and the files it relies on, report only: every
      # result is triaged in docs/security/static-analysis.md ("Legacy v3"),
      # and one of v3's Slither ids changes between identical runs, so a
      # triage database cannot gate it. A new result shows in the uploaded
      # reports and is triaged there; nothing here fails the job.
      - name: slither (legacy v3, report only)
        if: always()
        run: |
          for f in contracts/forwarding/TransferLegacyEOAContractV3.sol contracts/whitelist/NftCollectionWhiteList.sol contracts/common/LegacyPullVaultV2.sol; do
            slither "$f" \
              --compile-force-framework solc \
              --solc-remaps "@openzeppelin=node_modules/@openzeppelin" \
              --solc-args "--via-ir --optimize --optimize-runs 200 --evm-version cancun" \
              --filter-paths "node_modules" \
              --fail-none \
              --json "slither-v3-$(basename "$f" .sol).json" 2>&1 | tee -a slither-v3.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis
          path: |
            slither.txt
            slither-*.json
            slither-v3.txt
          retention-days: 30

  fuzz:
    name: foundry fuzz and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: forge --version
      - name: fuzz and invariants (default profile)
        run: |
          mkdir -p out
          FUZZ_SUMMARY=out/fuzz-summary.txt forge test --match-path "test/foundry/**" -vv
      - name: reach per operation
        if: always()
        run: |
          [ -f out/fuzz-summary.txt ] && awk '{c[$1]+=$2; a[$1]+=$3} END {for (k in c) printf "%-26s calls=%7d accepted=%6d\n", k, c[k], a[k]}' out/fuzz-summary.txt | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-summary
          path: out/fuzz-summary.txt
          retention-days: 30
